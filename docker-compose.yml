# One service. There used to be two: a Node bridge that exposed HTTP, and a
# "connectwise-mcp-server" container that ran a stdio MCP server with nothing
# attached to stdin -- which meant it read EOF, exited, and was restarted
# forever by `restart: unless-stopped` while doing no work at all.
#
# FastMCP serves HTTP itself, so the bridge is gone and this is the whole thing.

services:
  connectwise-mcp:
    build: .
    container_name: connectwise-mcp
    ports:
      - "${MCP_PORT:-3002}:3002"
    environment:
      - CW_COMPANY_ID=${CW_COMPANY_ID}
      - CW_PUBLIC_KEY=${CW_PUBLIC_KEY}
      - CW_PRIVATE_KEY=${CW_PRIVATE_KEY}
      - CW_API_URL=${CW_API_URL:-https://api-na.myconnectwise.net}
      - CW_API_VERSION=${CW_API_VERSION:-v2023.2}
      - CW_CLIENT_ID=${CW_CLIENT_ID:-mcp-connectwise-server}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # The container serves HTTP. Run the same file without this for stdio,
      # which is what Claude Code and Claude Desktop want.
      - MCP_TRANSPORT=http
      - MCP_PORT=3002
      # Required. The container refuses to start without it rather than serving
      # the whole ConnectWise instance to anyone who can reach the port.
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in .env}
      - CW_MAX_RETRIES=${CW_MAX_RETRIES:-3}
      - CW_MAX_RECORDS=${CW_MAX_RECORDS:-1000}
      # Empty means read-only, which is the default and the right default.
      # Set to notes / notes,time / all in .env to opt in. See README.
      - CW_ENABLE_WRITES=${CW_ENABLE_WRITES:-}
      - CW_WRITE_DRY_RUN=${CW_WRITE_DRY_RUN:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3002/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
